<!-- @dsCard group="Spacing" viewport="700x170" name="Bevel system" subtitle="Raised panel vs pressed slot — no drop shadows" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;box-sizing:border-box}.sw{display:flex;gap:10px;flex-wrap:wrap}.s{width:120px}.c{height:56px;border-radius:4px;border:1px solid var(--osrs-border-outline)}.n{font:600 12px/16px var(--font-sans);color:var(--text-body);margin-top:6px}.h{font:400 11px/14px var(--font-mono);color:var(--text-muted)}.lbl{font:400 11px/14px var(--font-mono);color:var(--text-muted)}</style></head><body><div style="display:flex;gap:28px;align-items:center"><div style="width:200px;height:96px;border-radius:6px;background:linear-gradient(180deg,#3B3327,#2B251D);border:1px solid;border-color:#5D503E #120E0A #120E0A #5D503E;display:grid;place-items:center;font:700 14px/18px var(--font-serif);color:var(--text-heading)">Raised panel</div><div style="width:200px;height:96px;border-radius:4px;background:#352E24;border:1px solid;border-color:#120E0A #514535 #514535 #120E0A;display:grid;place-items:center;font:500 13px/18px var(--font-mono);color:var(--text-body)">Pressed slot</div><div class="lbl" style="max-width:200px;line-height:18px">raised: light top/left, dark bottom/right<br>pressed: dark top/left, half-light bottom/right</div></div></body></html>
