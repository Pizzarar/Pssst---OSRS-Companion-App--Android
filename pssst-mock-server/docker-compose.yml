version: '3.8'

services:
  pssst-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: pssst-mock-server:latest
    container_name: pssst-mock-server
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      - PORT=8787
      - DATA_DIR=/app/data
    volumes:
      - pssst-data:/app/data

volumes:
  pssst-data:
    driver: local
