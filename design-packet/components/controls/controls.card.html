<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script><script src="../../ds-loader.js"></script>
<style>body{padding:16px;box-sizing:border-box}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:12px}.lbl{font:500 11px/16px var(--font-mono);color:var(--text-muted)}</style>
</head><body><div id="root"></div><script type="text/babel">
window.__dsReady.then((NSx)=>{
const { Button, TextField, Checkbox, Switch, SegmentedTabs, FilterChip } = NSx;
function App(){const [t,setT]=React.useState('dailies');return <div className="col">
<div className="row"><Button>Connect &amp; Start Sync</Button><Button variant="text">Learn more</Button><Button variant="text" tone="sync">Sync</Button><Button variant="text" tone="danger">Disconnect / Change Token</Button><Button disabled>Disabled</Button></div>
<div className="row" style={{alignItems:'flex-start'}}><TextField style={{width:300}} label="Server URL" defaultValue="http://192.168.1.20:8788" mono/><TextField style={{width:300}} label="Server URL" defaultValue="http://127.0.0.1:8788" mono error supportingText="127.0.0.1 is this phone, not your PC."/></div>
<div className="row"><Checkbox defaultChecked label="Remember this Sync Token on this device"/><Checkbox label="Unchecked"/><Switch defaultChecked/><Switch/></div>
<SegmentedTabs value={t} onChange={setT} tabs={[{id:'dailies',label:'Dailies',count:2},{id:'birdhouses',label:'Birdhouses',count:4},{id:'patches',label:'Patches'},{id:'payments',label:'Payments'}]}/>
<div className="row"><FilterChip shape="square" selected>Value</FilterChip><FilterChip shape="square">Name</FilterChip><FilterChip shape="square">Quantity</FilterChip><span style={{width:12}}/><FilterChip selected>All (158)</FilterChip><FilterChip>Completed (124)</FilterChip><FilterChip>In Progress (9)</FilterChip></div>
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
});</script></body></html>
