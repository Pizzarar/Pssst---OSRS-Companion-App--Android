<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;box-sizing:border-box}.sw{display:flex;gap:10px;flex-wrap:wrap}.s{width:120px}.c{height:56px;border-radius:4px;border:1px solid var(--osrs-border-outline)}.n{font:600 12px/16px var(--font-sans);color:var(--text-body);margin-top:6px}.h{font:400 11px/14px var(--font-mono);color:var(--text-muted)}.lbl{font:400 11px/14px var(--font-mono);color:var(--text-muted)}</style></head><body><div style="display:flex;gap:10px"><span style="font:400 10px/14px var(--font-pixel);letter-spacing:.5px;padding:3px 7px;border-radius:4px;background:var(--surface-inset);border:1px solid;border-color:var(--bevel-pressed);color:var(--accent)">NEW</span><span style="font:400 10px/14px var(--font-pixel);letter-spacing:.5px;padding:3px 7px;border-radius:4px;background:var(--surface-inset);border:1px solid;border-color:var(--bevel-pressed);color:var(--status-danger)">ADVANCED</span><span style="font:400 10px/14px var(--font-pixel);letter-spacing:.5px;padding:3px 7px;border-radius:4px;background:var(--surface-inset);border:1px solid;border-color:var(--bevel-pressed);color:var(--accent)">EASY</span><span style="font:400 10px/14px var(--font-pixel);letter-spacing:.5px;padding:3px 7px;border-radius:4px;background:var(--surface-inset);border:1px solid;border-color:var(--bevel-pressed);color:var(--accent)">MEDIUM</span></div></body></html>
