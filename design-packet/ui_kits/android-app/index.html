<!DOCTYPE html><html><head><meta charset="utf-8"><title>Pssst — Android app UI kit</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script><script src="../../ds-loader.js"></script><script src="data.js"></script>
<style>body{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#0f0d0a}</style></head><body><div id="root"></div>
<script type="text/babel" src="kit.jsx"></script><script type="text/babel" src="SetupScreen.jsx"></script><script type="text/babel" src="OverviewScreen.jsx"></script><script type="text/babel" src="StorageScreen.jsx"></script><script type="text/babel" src="ExchangeScreen.jsx"></script><script type="text/babel" src="ProgressScreen.jsx"></script><script type="text/babel" src="TimersScreen.jsx"></script><script type="text/babel" src="Dashboard.jsx"></script>
<script type="text/babel">
function App(){
  const start = new URLSearchParams(location.search).get('screen');
  const [url, setUrl] = React.useState(start && start !== 'setup' ? window.PSSST_DATA.serverUrl : null);
  return <PhoneFrame>{url ? <Dashboard serverUrl={url} initialTab={start && start !== 'setup' ? start : 'overview'} onDisconnect={() => setUrl(null)} /> : <SetupScreen onConnect={setUrl} />}</PhoneFrame>;
}
window.__dsReady.then(()=>ReactDOM.createRoot(document.getElementById('root')).render(<App/>));
</script></body></html>
